# Local Postgres, same major version as Neon (17).
# pnpm db:up / db:down / db:reset
services:
  postgres:
    image: postgres:17-alpine
    container_name: oda-postgres
    environment:
      POSTGRES_USER: oda
      POSTGRES_PASSWORD: oda
      POSTGRES_DB: oda
      TZ: UTC
    ports:
      - '5442:5432'
    volumes:
      - oda-pgdata:/var/lib/postgresql/data
      - ./packages/db/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oda -d oda']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  oda-pgdata:
