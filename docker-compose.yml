# Local Postgres, same major version as Neon (18).
# pnpm db:up / db:down / db:reset
services:
  postgres:
    image: postgres:18-alpine
    container_name: oda-postgres
    # Come back whenever Docker starts, unless stopped with `pnpm db:down`.
    restart: unless-stopped
    environment:
      POSTGRES_USER: oda
      POSTGRES_PASSWORD: oda
      POSTGRES_DB: oda
      TZ: UTC
    ports:
      - '5442:5432'
    volumes:
      # Postgres 18+ images keep data in a versioned subdirectory of /var/lib/postgresql.
      - oda-pgdata:/var/lib/postgresql
      - ./packages/db/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oda -d oda']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  oda-pgdata:
