name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: oda
          POSTGRES_PASSWORD: oda
          POSTGRES_DB: oda
        ports: ['5442:5432']
        options: >-
          --health-cmd "pg_isready -U oda -d oda"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      DATABASE_URL: postgres://oda:oda@localhost:5442/oda
      PUBLIC_SHOP_BASE_URL: http://localhost:3000
      # CI-only values (no real secret): Playwright's server signs sessions and reset links.
      BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdefghij
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
      # Turbo's local cache, kept between runs by actions/cache below (no remote cache, no token).
      TURBO_CACHE_DIR: .turbo/cache

    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request's merge commit and its base, to list the files it changes.
          fetch-depth: 2

      # Docs-only pull requests (only docs/, design/, or Markdown outside apps/ and packages/)
      # skip the heavy steps below; the check still runs and reports green, so "merge after every
      # check passes" holds. Pushes to main always run everything (migrate-staging deploys only
      # after a green run here). docs/help-guides.md counts as code: a seller test reads it.
      - name: What changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          heavy=false
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request: running everything."
            heavy=true
          elif ! files=$(git diff --name-only HEAD^1 HEAD) || [ -z "$files" ]; then
            echo "Couldn't list the changed files: running everything."
            heavy=true
          else
            echo "Changed files:"
            echo "$files"
            while IFS= read -r f; do
              case "$f" in
                docs/help-guides.md) heavy=true ;;
                docs/* | design/*) ;;
                apps/* | packages/*) heavy=true ;;
                *.md) ;;
                *) heavy=true ;;
              esac
            done <<< "$files"
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          if [ "$heavy" = true ]; then
            echo "Code changed: every step runs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Docs-only change: lint, typecheck, tests, build, Playwright and Expo checks skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turbo replays lint, typecheck and test results for packages whose inputs haven't changed
      # (turbo.json: a package's tasks also rerun when a package it depends on changes).
      - name: Turbo cache
        if: steps.changes.outputs.heavy == 'true'
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Format
        run: pnpm format:check

      # Expo/EAS config belongs in apps/seller; a root app.json means a command ran in the
      # wrong folder (Step 49).
      - name: No stray Expo files at the repo root
        run: pnpm check:root

      - name: Workflows keep staging and production apart
        run: pnpm check:workflows

      - name: Lint
        if: steps.changes.outputs.heavy == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.changes.outputs.heavy == 'true'
        run: pnpm typecheck

      - name: Migrate
        if: steps.changes.outputs.heavy == 'true'
        run: pnpm db:migrate

      - name: Unit tests
        if: steps.changes.outputs.heavy == 'true'
        run: pnpm test

      - name: Build web
        if: steps.changes.outputs.heavy == 'true'
        run: pnpm --filter @oda/web build

      - name: Install Playwright browser
        if: steps.changes.outputs.heavy == 'true'
        run: pnpm --filter @oda/web exec playwright install --with-deps chromium

      - name: Playwright smoke
        if: steps.changes.outputs.heavy == 'true'
        run: pnpm --filter @oda/web test:e2e

      # Every installed copy (transitive ones too) must match the Expo SDK's versions.
      - name: Expo SDK dependency versions
        if: steps.changes.outputs.heavy == 'true'
        run: pnpm --filter @oda/seller deps:check

      - name: Expo doctor
        if: steps.changes.outputs.heavy == 'true'
        working-directory: apps/seller
        run: pnpm run doctor

      - uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.heavy == 'true'
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # Mirrors migrate-staging: a clean runner with the same reduced install, then the migration,
  # so a package the migration needs but the filter skips fails here, before merge (#39).
  migrate-install:
    name: Staging migrate install
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: oda
          POSTGRES_PASSWORD: oda
          POSTGRES_DB: oda
        ports: ['5442:5432']
        options: >-
          --health-cmd "pg_isready -U oda -d oda"
          --health-interval 2s --health-timeout 3s --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Same command as migrate-staging.yml.
      - run: pnpm install --frozen-lockfile --filter "@oda/db..."

      - name: Migrate (as migrate-staging does)
        env:
          DATABASE_URL_UNPOOLED: postgres://oda:oda@localhost:5442/oda
        run: pnpm db:migrate

      # The app role script on the same reduced install (db-app-role, migrate-staging; #93 D5).
      - name: App role (as db-app-role does)
        env:
          DATABASE_URL_UNPOOLED: postgres://oda:oda@localhost:5442/oda
          ODA_APP_DB_PASSWORD: ci-only-app-role-password-not-secret
        run: pnpm --filter @oda/db db:app-role
