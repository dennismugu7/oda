name: cron-expire-orders

# Hourly auto-expire (order-lifecycle.md, decisions #65, #69): asks staging to cancel buyer-placed
# pay-now orders still unpaid 48 h after they started waiting. The job itself runs on the
# server (/api/cron/expire-orders, through transitionOrder()); this only calls it with the
# Bearer secret CRON_SECRET (the same value is set in Vercel). Also runnable by hand.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: cron-expire-orders
  cancel-in-progress: false

permissions:
  contents: read

env:
  URL: https://oda-eta.vercel.app/api/cron/expire-orders

jobs:
  expire:
    name: Expire unpaid orders
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Call the job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set."; exit 1
          fi
          # Neon may need a few seconds to wake up: retry twice. The secret is never printed.
          for attempt in 1 2 3; do
            status=$(curl -sS -o result.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CRON_SECRET" --max-time 60 "$URL" || echo 000)
            if [ "$status" = "200" ]; then
              echo "Result: $(cat result.json)"
              echo "Expired orders: $(cat result.json)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt answered $status"
            sleep 15
          done
          echo "::error::The job did not answer 200 (404 = CRON_SECRET differs from Vercel's)."
          exit 1
