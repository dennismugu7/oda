name: cron-expire-orders

# Hourly auto-expire (order-lifecycle.md, decisions #65, #69): asks each deployment to cancel
# buyer-placed pay-now orders still unpaid 48 h after they started waiting. The job itself runs
# on the server (/api/cron/expire-orders, through transitionOrder()); this only calls it with
# the Bearer secret (the same value is set in that Vercel project). Also runnable by hand.
#
# Targets (M11 CP2, decision #93 D3/D11): the GitHub Environment gives the address (variable
# BASE_URL) and the secret. Staging: Environment `staging`, secret CRON_SECRET. Production:
# Environment `production-jobs`, secret PRODUCTION_CRON_SECRET, scheduled only once the
# repository variable PRODUCTION_LIVE is `true`.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which deployment'
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: cron-expire-orders-${{ inputs.target || 'scheduled' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  expire:
    name: Expire unpaid orders (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target && format('["{0}"]', inputs.target) || (vars.PRODUCTION_LIVE == 'true' && '["staging","production"]' || '["staging"]')) }}
    environment: ${{ matrix.target == 'production' && 'production-jobs' || 'staging' }}
    steps:
      - name: Call the job
        env:
          TARGET: ${{ matrix.target }}
          BASE_URL: ${{ vars.BASE_URL }}
          # The name is picked, never a fallback: production reads only its own secret.
          CRON_SECRET: ${{ secrets[matrix.target == 'production' && 'PRODUCTION_CRON_SECRET' || 'CRON_SECRET'] }}
        run: |
          [[ "$BASE_URL" == https://* ]] || { echo "::error::Variable BASE_URL is not set in the $TARGET Environment."; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "::error::The $TARGET cron secret is not set (CRON_SECRET / PRODUCTION_CRON_SECRET)."; exit 1; }
          URL="$BASE_URL/api/cron/expire-orders"
          # Neon may need a few seconds to wake up: retry twice. The secret is never printed.
          for attempt in 1 2 3; do
            status=$(curl -sS -o result.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CRON_SECRET" --max-time 60 "$URL" || echo 000)
            if [ "$status" = "200" ]; then
              echo "Result: $(cat result.json)"
              echo "Expired orders ($TARGET): $(cat result.json)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt answered $status"
            sleep 15
          done
          echo "::error::The job did not answer 200 (404 = the cron secret differs from Vercel's)."
          exit 1
