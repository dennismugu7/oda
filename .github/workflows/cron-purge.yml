name: cron-purge

# Daily purge (decisions #72 c, #74 c, #75): accounts deleted 30+ days ago (files, data, auth
# user), soft-deleted products after 30 days (keeping thumbnails past orders show), failed file
# deletes, unreferenced files over 24 h old, sign-up attempts over 7 days. The work runs on the
# server (/api/cron/purge); this only calls it with the Bearer secret.
# Manual runs default to a DRY RUN: it reports what it would remove and removes nothing. Every
# run writes an ops_events audit row with the GitHub user who ran it.
#
# Targets as in cron-expire-orders.yml (M11 CP2): Environment `staging` (CRON_SECRET) or
# `production-jobs` (PRODUCTION_CRON_SECRET, scheduled once PRODUCTION_LIVE is `true`).
on:
  schedule:
    - cron: '43 0 * * *' # 03:43 Nairobi
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: report what would be removed, remove nothing'
        type: boolean
        default: true
      target:
        description: 'Which deployment'
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: cron-purge-${{ inputs.target || 'scheduled' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  purge:
    name: Purge (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target && format('["{0}"]', inputs.target) || (vars.PRODUCTION_LIVE == 'true' && '["staging","production"]' || '["staging"]')) }}
    environment: ${{ matrix.target == 'production' && 'production-jobs' || 'staging' }}
    steps:
      - name: Call the job
        env:
          TARGET: ${{ matrix.target }}
          BASE_URL: ${{ vars.BASE_URL }}
          CRON_SECRET: ${{ secrets[matrix.target == 'production' && 'PRODUCTION_CRON_SECRET' || 'CRON_SECRET'] }}
          # Scheduled runs have no inputs: a real run. Manual runs: the checkbox (default on).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          ACTOR: ${{ github.event_name == 'workflow_dispatch' && github.actor || 'schedule' }}
        run: |
          [[ "$BASE_URL" == https://* ]] || { echo "::error::Variable BASE_URL is not set in the $TARGET Environment."; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "::error::The $TARGET cron secret is not set (CRON_SECRET / PRODUCTION_CRON_SECRET)."; exit 1; }
          URL="$BASE_URL/api/cron/purge"
          body=$(jq -cn --argjson dry "$DRY_RUN" '{dryRun: $dry}')
          # Neon may need a few seconds to wake up: retry twice. The secret is never printed.
          for attempt in 1 2 3; do
            status=$(curl -sS -o result.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CRON_SECRET" -H "x-oda-actor: $ACTOR" \
              -H 'content-type: application/json' -d "$body" --max-time 90 "$URL" || echo 000)
            if [ "$status" = "200" ]; then
              echo "Result: $(cat result.json)"
              {
                if [ "$DRY_RUN" = "true" ]; then echo "### Purge ($TARGET) DRY RUN: nothing was removed"; else echo "### Purge ($TARGET)"; fi
                jq -r '"- Deleted accounts: \(.accounts) (\(.accountFiles) files)\(if (.slugs|length) > 0 then ": " + (.slugs|map(. // "no shop")|join(", ")) else "" end)",
                       "- Demo shops skipped: \(.skippedDemo|length)",
                       "- Soft-deleted products: \(.products) (\(.productFiles) files; \(.keptForOrders) kept for past orders)",
                       "- Failed deletes retried: \(.retried)",
                       "- Unreferenced files: \(.unreferenced)",
                       "- Old sign-up attempts: \(.signupAttempts)",
                       "- Expired records: \(.rateLimits // 0) rate-limit counters, \(.deletionRequests // 0) delete-account requests, \(.verifications // 0) reset tokens",
                       "- Payment claims with M-Pesa message text cleared: \(.claimMessages // 0)",
                       "- Files that failed (queued for next run): \(.failedFiles)",
                       "- Storage not answering (accounts kept, sweep skipped): \(.storageUnavailable // false)",
                       "- More left for the next run: \(.more)"' result.json
                if [ "$(jq '.unreferencedFiles|length' result.json)" -gt 0 ]; then
                  echo
                  echo "**Unreferenced files** (key · uploaded · why):"
                  jq -r '.unreferencedFiles[] | "- `\(.key)` · \(.uploadedAt) · \(.why)"' result.json
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt answered $status"
            sleep 15
          done
          echo "::error::The job did not answer 200 (404 = the cron secret differs from Vercel's)."
          exit 1
