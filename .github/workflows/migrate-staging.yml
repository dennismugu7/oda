name: migrate-staging

# Migrate, then deploy staging (decision #27, race fixed in M1): Vercel no longer deploys
# `main` on push (apps/web/vercel.json). After CI passes on `main`, deploy.yml applies the
# Drizzle migrations to Neon staging, re-applies the app role's grants, triggers the staging
# project's Deploy Hook and waits until /api/health reports the new commit. So a deployment
# never runs against a schema older than the code it ships.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Never run two at once; never cancel one halfway.
concurrency:
  group: migrate-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    # Only after a green CI run on a push to main (or by hand).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: ./.github/workflows/deploy.yml
    with:
      target: staging
      # The commit CI tested (manual runs: the branch's latest commit).
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
