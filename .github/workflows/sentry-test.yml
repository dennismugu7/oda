name: sentry-test

# Sends one test error from the staging web server to Sentry (M10 CP4, decision #87) to check
# reporting end to end. The error's made-up email and phone must show in Sentry as [email] and
# [phone]. Called with the Bearer secret OPS_SECRET (the same value is set in Vercel).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  URL: https://oda-eta.vercel.app/api/ops/sentry-test

jobs:
  send:
    name: Send a test error
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Call the server
        env:
          OPS_SECRET: ${{ secrets.OPS_SECRET }}
        run: |
          [ -n "$OPS_SECRET" ] || { echo "::error::Repository secret OPS_SECRET is not set."; exit 1; }
          for attempt in 1 2 3; do
            status=$(curl -sS -o result.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $OPS_SECRET" --max-time 60 "$URL" || echo 000)
            if [ "$status" = "200" ]; then
              echo "Answer: $(cat result.json)"
              echo "Sentry test: $(cat result.json)" >> "$GITHUB_STEP_SUMMARY"
              grep -q '"sent":true' result.json || { echo "::error::Not sent: $(cat result.json)"; exit 1; }
              exit 0
            fi
            if [ "$status" != "000" ]; then break; fi
            sleep 15
          done
          echo "::error::The server answered $status: $(cat result.json 2>/dev/null)"
          exit 1
