name: eas-update-preview

# Publishes the seller app's JavaScript as an EAS Update to the preview channel and uploads
# that update's source maps to Sentry (oda-seller), all on the runner (decision #90): no
# Sentry token and no sentry-cli on the laptop. Started by `pnpm update:preview "What changed"`
# (or by hand: Run workflow, pick the branch). Phones on the matching runtime (app version)
# get it after closing and reopening the app twice.
on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed (shown in EAS)
        required: true
        type: string

concurrency:
  group: eas-update-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish and upload source maps
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the secrets exist
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "::error::Repository secret EXPO_TOKEN is not set."; exit 1; }
          [ -n "$SENTRY_AUTH_TOKEN" ] || { echo "::error::Repository secret SENTRY_AUTH_TOKEN is not set."; exit 1; }

      # The version eas.json asks for (cli.version), pinned.
      - name: Install eas-cli
        run: npm install --global eas-cli@24.11.0

      - name: Publish the update
        working-directory: apps/seller
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MESSAGE: ${{ inputs.message }}
        run: node scripts/eas-update-publish.mjs

      # Debug IDs (metro.config.js) tie each bundle to its map, so no release name is needed.
      - name: Upload the source maps to Sentry
        working-directory: apps/seller
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mugu-labs
          SENTRY_PROJECT: oda-seller
          # Must stay set: without it Sentry's script looks for its Expo config plugin (we have none)
          # and stops. sentry-cli uses the address inside the org token anyway (sentry.io, which
          # routes to the EU organisation); a different value here only adds a warning (run
          # 37762416080 ignored https://de.sentry.io/ and uploaded fine through sentry.io).
          SENTRY_URL: https://sentry.io/
        run: node node_modules/@sentry/react-native/scripts/expo-upload-sourcemaps.js dist
