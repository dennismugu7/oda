name: cron-digest

# Daily support digest at 08:00 Nairobi (decisions #72 b, #74 e): emails support@mugu-labs.com
# the new buyer reports, seller feedback (with screenshot links) and reported reviews, only
# when there is something new. The work runs on the server (/api/cron/digest); this only calls
# it with the Bearer secret CRON_SECRET. Also runnable by hand.
on:
  schedule:
    - cron: '11 5 * * *' # 08:11 Nairobi
  workflow_dispatch:

concurrency:
  group: cron-digest
  cancel-in-progress: false

permissions:
  contents: read

env:
  URL: https://oda-eta.vercel.app/api/cron/digest

jobs:
  digest:
    name: Send the support digest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Call the job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set."; exit 1
          fi
          # Neon may need a few seconds to wake up: retry twice. The secret is never printed.
          for attempt in 1 2 3; do
            status=$(curl -sS -o result.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CRON_SECRET" --max-time 60 "$URL" || echo 000)
            if [ "$status" = "200" ]; then
              echo "Result: $(cat result.json)"
              jq -r 'if .sent then "Digest sent: \(.reports) reports, \(.feedback) feedback, \(.reviews) reported reviews" else "Nothing new: no email sent" end' \
                result.json >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt answered $status"
            sleep 15
          done
          echo "::error::The job did not answer 200 (404 = CRON_SECRET differs from Vercel's)."
          exit 1
