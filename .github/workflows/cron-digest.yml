name: cron-digest

# Daily support digest at 08:00 Nairobi (decisions #72 b, #74 e): emails support@mugu-labs.com
# the new buyer reports, seller feedback (with screenshot links) and reported reviews, only
# when there is something new. The work runs on the server (/api/cron/digest); this only calls
# it with the Bearer secret. Also runnable by hand.
#
# Targets as in cron-expire-orders.yml (M11 CP2): Environment `staging` (CRON_SECRET) or
# `production-jobs` (PRODUCTION_CRON_SECRET, scheduled once PRODUCTION_LIVE is `true`).
on:
  schedule:
    - cron: '11 5 * * *' # 08:11 Nairobi
  workflow_dispatch:
    inputs:
      target:
        description: 'Which deployment'
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: cron-digest-${{ inputs.target || 'scheduled' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    # Runs only from main (public repo hardening): no other branch reaches these secrets.
    if: github.ref == 'refs/heads/main'
    name: Send the support digest (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target && format('["{0}"]', inputs.target) || (vars.PRODUCTION_LIVE == 'true' && '["staging","production"]' || '["staging"]')) }}
    environment: ${{ matrix.target == 'production' && 'production-jobs' || 'staging' }}
    steps:
      - name: Call the job
        env:
          TARGET: ${{ matrix.target }}
          BASE_URL: ${{ vars.BASE_URL }}
          CRON_SECRET: ${{ secrets[matrix.target == 'production' && 'PRODUCTION_CRON_SECRET' || 'CRON_SECRET'] }}
        run: |
          [[ "$BASE_URL" == https://* ]] || { echo "::error::Variable BASE_URL is not set in the $TARGET Environment."; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "::error::The $TARGET cron secret is not set (CRON_SECRET / PRODUCTION_CRON_SECRET)."; exit 1; }
          URL="$BASE_URL/api/cron/digest"
          # Neon may need a few seconds to wake up: retry twice. The secret is never printed.
          for attempt in 1 2 3; do
            status=$(curl -sS -o result.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CRON_SECRET" --max-time 60 "$URL" || echo 000)
            if [ "$status" = "200" ]; then
              echo "Result: $(cat result.json)"
              jq -r --arg t "$TARGET" 'if .sent then "Digest sent (\($t)): \(.reports) reports, \(.feedback) feedback, \(.reviews) reported reviews" else "Nothing new (\($t)): no email sent" end' \
                result.json >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt answered $status"
            sleep 15
          done
          echo "::error::The job did not answer 200 (404 = the cron secret differs from Vercel's)."
          exit 1
