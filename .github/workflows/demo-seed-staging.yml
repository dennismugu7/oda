name: demo-seed-staging

# The staging demo shop "Demo Duka" (milestones M4, owner Step 63): 12 products with
# generated placeholder photos, obviously fake data, no seller password. Manual only; resets
# Demo Duka's settings, fake Till, delivery areas and product details on every run
# (decision #61 g), and makes the sample orders again (links in the job summary). Writes to Neon staging and the public images
# store (STAGING_IMAGES_BLOB_READ_WRITE_TOKEN). Code: apps/web/server/demoSeed/.
on:
  workflow_dispatch:

concurrency:
  group: demo-seed-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    name: Seed the staging demo shop
    runs-on: ubuntu-24.04
    # Staging only (M11 CP2): this Environment holds no production secret or address;
    # scripts/check-workflows.mjs fails CI if this tool could reach production.
    environment: staging
    timeout-minutes: 15

    steps:
      - name: Check the secrets are set
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.NEON_STAGING_DATABASE_URL_UNPOOLED }}
          STAGING_IMAGES_BLOB_READ_WRITE_TOKEN: ${{ secrets.STAGING_IMAGES_BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Repository secret NEON_STAGING_DATABASE_URL_UNPOOLED is not set."; exit 1
          fi
          if [ -z "$STAGING_IMAGES_BLOB_READ_WRITE_TOKEN" ]; then
            echo "::error::Repository secret STAGING_IMAGES_BLOB_READ_WRITE_TOKEN is not set (the images store's read-write token)."; exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter "@oda/web..."

      - name: Seed Demo Duka
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL_UNPOOLED }}
          STAGING_IMAGES_BLOB_READ_WRITE_TOKEN: ${{ secrets.STAGING_IMAGES_BLOB_READ_WRITE_TOKEN }}
          # Base for the sample order links in the job summary.
          PUBLIC_SHOP_BASE_URL: ${{ vars.BASE_URL }}
          DEMO_LINKS_FILE: ${{ runner.temp }}/demo-order-links.txt
        run: pnpm exec tsx --conditions=react-server server/demoSeed/run.ts

      # The same links as the job summary, for `gh run download` (fake orders; 1 day).
      - uses: actions/upload-artifact@v7
        with:
          name: demo-order-links
          path: ${{ runner.temp }}/demo-order-links.txt
          retention-days: 1
