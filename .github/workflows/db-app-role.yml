name: db-app-role

# Creates or updates the web app's least-privilege database role `oda_app` (decision #93 D5,
# hardening report S11): rows only (select, insert, update, delete), no DDL, no truncate, owns
# nothing, in no role (so not in neon_superuser: it's created in SQL, never in the Neon
# console). It sets the password from the role password secret (Neon accepts only the password
# itself, sent over TLS; Neon stores a SCRAM hash), applies the grants, then logs in as the
# role over the direct and the pooled host and checks that create / drop / truncate are
# refused. The summary shows host names and counts, never a password or connection string.
# deploy.yml re-applies the grants after every migration (without the password).
#
# Targets (M11 CP2; each secret picked by name, never as a fallback):
# - staging: Environment `staging`, NEON_STAGING_DATABASE_URL_UNPOOLED, ODA_APP_DB_PASSWORD.
# - production: Environment `production-jobs`, PRODUCTION_NEON_DATABASE_URL_UNPOOLED,
#   PRODUCTION_ODA_APP_DB_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Database'
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: db-app-role-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  app-role:
    # Runs only from main (public repo hardening): no other branch reaches these secrets.
    if: github.ref == 'refs/heads/main'
    name: App database role (${{ inputs.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.target == 'production' && 'production-jobs' || 'staging' }}
    env:
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check the secrets are set
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_NEON_DATABASE_URL_UNPOOLED' || 'NEON_STAGING_DATABASE_URL_UNPOOLED'] }}
          ODA_APP_DB_PASSWORD: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_ODA_APP_DB_PASSWORD' || 'ODA_APP_DB_PASSWORD'] }}
        run: |
          [ -n "$DATABASE_URL_UNPOOLED" ] || { echo "::error::The $TARGET database secret is not set."; exit 1; }
          case "$DATABASE_URL_UNPOOLED" in
            *-pooler.*) echo "::error::The $TARGET database secret is the pooled string; use the direct one."; exit 1 ;;
          esac
          [ -n "$ODA_APP_DB_PASSWORD" ] || { echo "::error::The $TARGET role password secret is not set."; exit 1; }

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The same reduced install as deploy.yml (decision #39).
      - run: pnpm install --frozen-lockfile --filter "@oda/db..."

      - name: Create / update the role, grant, check
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_NEON_DATABASE_URL_UNPOOLED' || 'NEON_STAGING_DATABASE_URL_UNPOOLED'] }}
          ODA_APP_DB_PASSWORD: ${{ secrets[inputs.target == 'production' && 'PRODUCTION_ODA_APP_DB_PASSWORD' || 'ODA_APP_DB_PASSWORD'] }}
        run: pnpm --filter @oda/db db:app-role
