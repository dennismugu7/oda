packages:
  - apps/*
  - packages/*

# pnpm blocks dependency install scripts unless allowed here.
allowBuilds:
  # Sentry stays inactive until M10 (decision #70): no CLI binary download, no source-map upload.
  '@sentry/cli': false
  esbuild: true
  sharp: true
  unrs-resolver: true

# pnpm refuses versions published in the last day unless excluded (supply-chain guard).
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
  - vitest@5.0.3
  - '@next/env@16.3.8'
  - '@next/eslint-plugin-next@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - eslint-config-next@16.3.8
  - next@16.3.8
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo@57.0.27
  - '@expo/ui@57.0.22'
  - expo-eas-client@57.0.5
  - expo-image-manipulator@57.0.21
  - expo-linking@57.0.12
  - expo-notifications@57.0.22
  - expo-router@57.0.25
  - expo-updates@57.0.25

# Keep React Native tooling on the versions Expo SDK 57 was built against.
overrides:
  '@react-native/metro-config': 0.86.3
